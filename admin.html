<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Car Finder Admin Panel</title>

  <!-- Bootstrap CSS -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <!-- Custom CSS -->

  <link rel="stylesheet" href="style.css" />

</head>

<body class="admin-body">

  <!-- =========================
       NAVBAR
  ========================= -->

  <nav class="navbar navbar-expand-lg navbar-dark admin-navbar shadow-sm">

    <div class="container">

      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-speedometer2"></i>
        Car Finder Admin
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#adminNavbar"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="adminNavbar">

        <ul class="navbar-nav ms-auto align-items-lg-center">

          <li class="nav-item me-lg-3">
            <span class="badge bg-warning text-dark p-2">
              Admin Dashboard
            </span>
          </li>

          <li class="nav-item">
            <a href="index.html" class="btn btn-light">
              <i class="bi bi-house-door-fill"></i>
              User Website
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- =========================
       MAIN CONTAINER
  ========================= -->

  <div class="container py-5">

    <!-- =========================
         PAGE HEADING
    ========================= -->

    <div class="mb-5 text-center">

      <h1 class="fw-bold">
        Admin Dashboard
      </h1>

      <p class="text-muted">
        Manage all second-hand car listings
      </p>

    </div>

    <!-- =========================
         STATISTICS SECTION
    ========================= -->

    <div class="row g-4 mb-5">

      <!-- Total Cars -->

      <div class="col-md-6 col-lg-3">

        <div class="stat-card">

          <div class="d-flex justify-content-between align-items-center">

            <div>
              <h6 class="text-muted">Total Cars</h6>
              <h2 id="totalCars">0</h2>
            </div>

            <i class="bi bi-car-front-fill fs-1 text-primary"></i>

          </div>

        </div>

      </div>

      <!-- Average Price -->

      <div class="col-md-6 col-lg-3">

        <div class="stat-card">

          <div class="d-flex justify-content-between align-items-center">

            <div>
              <h6 class="text-muted">Average Price</h6>
              <h2 id="averagePrice">0</h2>
            </div>

            <i class="bi bi-cash-stack fs-1 text-success"></i>

          </div>

        </div>

      </div>

      <!-- Hybrid Cars -->

      <div class="col-md-6 col-lg-3">

        <div class="stat-card">

          <div class="d-flex justify-content-between align-items-center">

            <div>
              <h6 class="text-muted">Hybrid Cars</h6>
              <h2 id="hybridCars">0</h2>
            </div>

            <i class="bi bi-lightning-charge-fill fs-1 text-warning"></i>

          </div>

        </div>

      </div>

      <!-- Most Common Brand -->

      <div class="col-md-6 col-lg-3">

        <div class="stat-card">

          <div class="d-flex justify-content-between align-items-center">

            <div>
              <h6 class="text-muted">Common Brand</h6>
              <h2 id="commonBrand">-</h2>
            </div>

            <i class="bi bi-bar-chart-fill fs-1 text-danger"></i>

          </div>

        </div>

      </div>

    </div>

    <!-- =========================
         SEARCH SECTION
    ========================= -->

    <div class="card border-0 shadow-sm mb-4">

      <div class="card-body">

        <div class="row align-items-center">

          <div class="col-md-6">

            <h5 class="fw-bold mb-0">
              Car Listings
            </h5>

          </div>

          <div class="col-md-6 mt-3 mt-md-0">

            <input
              type="text"
              id="adminSearch"
              class="form-control"
              placeholder="Search car by name..."
            />

          </div>

        </div>

      </div>

    </div>

    <!-- =========================
         TABLE SECTION
    ========================= -->

    <div class="card border-0 shadow">

      <div class="card-body table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-dark">

            <tr>

              <th>Image</th>

              <th>Car Name</th>

              <th>Brand</th>

              <th>Year</th>

              <th>Price</th>

              <th>Fuel</th>

              <th>City</th>

              <th>Actions</th>

            </tr>

          </thead>

          <tbody id="adminTableBody">

            <!-- Dynamic Data -->

          </tbody>

        </table>

      </div>

    </div>

  </div>

  <!-- =========================
       EDIT MODAL
  ========================= -->

  <div
    class="modal fade"
    id="editModal"
    tabindex="-1"
  >

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <!-- Modal Header -->

        <div class="modal-header bg-dark text-white">

          <h5 class="modal-title">
            Edit Car Details
          </h5>

          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
          ></button>

        </div>

        <!-- Modal Body -->

        <div class="modal-body">

          <form id="editForm">

            <!-- Hidden ID -->

            <input type="hidden" id="editId" />

            <!-- Car Name -->

            <div class="mb-3">

              <label class="form-label">
                Car Name
              </label>

              <input
                type="text"
                id="editName"
                class="form-control"
                required
              />

            </div>

            <!-- Price -->

            <div class="mb-3">

              <label class="form-label">
                Price
              </label>

              <input
                type="number"
                id="editPrice"
                class="form-control"
                required
              />

            </div>

            <!-- City -->

            <div class="mb-3">

              <label class="form-label">
                City
              </label>

              <input
                type="text"
                id="editCity"
                class="form-control"
                required
              />

            </div>

            <!-- Contact -->

            <div class="mb-4">

              <label class="form-label">
                Contact Number
              </label>

              <input
                type="text"
                id="editContact"
                class="form-control"
                required
              />

            </div>

            <!-- Buttons -->

            <div class="d-flex gap-2">

              <button
                type="submit"
                class="btn btn-primary w-100"
              >
                <i class="bi bi-save-fill"></i>
                Update Car
              </button>

              <button
                type="button"
                class="btn btn-secondary w-100"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- Bootstrap JS -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Admin JS -->

  <script src="admin.js"></script>

</body>
</html>
