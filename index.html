<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Car Finder</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navbar -->

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container">

      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-car-front-fill"></i> Car Finder
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ms-auto align-items-lg-center">

          <li class="nav-item">
            <a class="nav-link" href="#cars-section">Cars</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#add-car-section">Sell Car</a>
          </li>

          <li class="nav-item ms-lg-3">
            <a href="admin.html" class="btn btn-warning">
              Admin Panel
            </a>
          </li>

        </ul>

      </div>
    </div>
  </nav>

  <!-- Hero Section -->

  <section class="hero-section">
    <div class="container">

      <div class="row align-items-center">

        <div class="col-lg-6">
          <h1 class="display-4 fw-bold mb-3">
            Find Your Perfect Used Car
          </h1>

          <p class="lead text-muted">
            Browse second-hand cars from trusted local sellers in Pakistan.
          </p>

          <a href="#cars-section" class="btn btn-primary btn-lg mt-3">
            Explore Cars
          </a>
        </div>

        <div class="col-lg-6 text-center">
          <img
            src="https://images.unsplash.com/photo-1503376780353-7e6692767b70"
            class="img-fluid rounded hero-image"
            alt="Car"
          />
        </div>

      </div>

    </div>
  </section>

  <!-- Filter Section -->

  <section class="container mb-5">

    <div class="filter-box shadow-sm">

      <div class="row g-3">

        <div class="col-md-4">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Search by car name"
          />
        </div>

        <div class="col-md-3">
          <select id="brandFilter" class="form-select">
            <option value="all">All Brands</option>
            <option value="Toyota">Toyota</option>
            <option value="Honda">Honda</option>
            <option value="Suzuki">Suzuki</option>
            <option value="Kia">Kia</option>
            <option value="Hyundai">Hyundai</option>
          </select>
        </div>

        <div class="col-md-3">
          <select id="fuelFilter" class="form-select">
            <option value="all">All Fuel Types</option>
            <option value="Petrol">Petrol</option>
            <option value="Hybrid">Hybrid</option>
            <option value="Diesel">Diesel</option>
          </select>
        </div>

        <div class="col-md-2">
          <select id="sortPrice" class="form-select">
            <option value="default">Sort Price</option>
            <option value="lowToHigh">Low to High</option>
            <option value="highToLow">High to Low</option>
          </select>
        </div>

      </div>

    </div>

  </section>

  <!-- Cars Section -->

  <section class="container mb-5" id="cars-section">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">Available Cars</h2>

      <button id="darkModeBtn" class="btn btn-outline-dark">
        Dark Mode
      </button>
    </div>

    <!-- Messages -->

    <div id="messageBox"></div>

    <!-- Car Cards -->

    <div class="row g-4" id="carContainer"></div>

  </section>

  <!-- Add Car Form -->

  <section class="container mb-5" id="add-car-section">

    <div class="card shadow-lg border-0">

      <div class="card-body p-4">

        <h2 class="fw-bold mb-4">
          Sell Your Car
        </h2>

        <form id="carForm" novalidate>

          <div class="row">

            <div class="col-md-6 mb-3">
              <label class="form-label">Car Name</label>

              <input
                type="text"
                id="name"
                class="form-control"
              />

              <small class="text-danger" id="nameError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Brand</label>

              <select id="brand" class="form-select">
                <option value="">Select Brand</option>
                <option value="Toyota">Toyota</option>
                <option value="Honda">Honda</option>
                <option value="Suzuki">Suzuki</option>
                <option value="Kia">Kia</option>
                <option value="Hyundai">Hyundai</option>
              </select>

              <small class="text-danger" id="brandError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Model Year</label>

              <input
                type="number"
                id="year"
                class="form-control"
              />

              <small class="text-danger" id="yearError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Price</label>

              <input
                type="number"
                id="price"
                class="form-control"
              />

              <small class="text-danger" id="priceError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Fuel Type</label>

              <select id="fuel" class="form-select">
                <option value="">Select Fuel</option>
                <option value="Petrol">Petrol</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Diesel">Diesel</option>
              </select>

              <small class="text-danger" id="fuelError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Transmission</label>

              <select id="transmission" class="form-select">
                <option value="">Select Transmission</option>
                <option value="Automatic">Automatic</option>
                <option value="Manual">Manual</option>
              </select>

              <small class="text-danger" id="transmissionError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Mileage</label>

              <input
                type="text"
                id="mileage"
                class="form-control"
              />

              <small class="text-danger" id="mileageError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">City</label>

              <input
                type="text"
                id="city"
                class="form-control"
              />

              <small class="text-danger" id="cityError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Image URL</label>

              <input
                type="text"
                id="image"
                class="form-control"
              />

              <small class="text-danger" id="imageError"></small>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Contact Number</label>

              <input
                type="text"
                id="contact"
                class="form-control"
              />

              <small class="text-danger" id="contactError"></small>
            </div>

            <div class="col-12 mb-3">
              <label class="form-label">Description</label>

              <textarea
                id="description"
                rows="4"
                class="form-control"
              ></textarea>

              <small class="text-danger" id="descriptionError"></small>
            </div>

          </div>

          <button class="btn btn-primary" type="submit">
            Add Car
          </button>

        </form>

      </div>

    </div>

  </section>

  <script src="app.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
